<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script src="./scripts/images.js"></script>
</head>

<body onload="loadAllImages()">

    <header class="page-header">
        <img src="./assets/svg/fotogram_logo.svg" alt="The Fotogram logo.">
    </header>

    <main>
        <section class="photos-section">
            <header>
                <h1>Your personal photo album</h1>
            </header>

            <div id="images-panel" class="photos-panel">

            </div>

            <dialog id="photo-dialog">
                <div class="photo-dialog-headline">
                    <p id="photo-dialog-title">Dummy title</p>
                    <button class="close-dialog-button" onclick="closePhotoDialog()">
                        <img src="./assets/icons/close.svg" alt="A white cross.">
                    </button>
                </div>

                <img id="current-dialog-image">

                <div class="dialog-button-panel">
                    <button class="dialog-image-selector-button previous-selector-button" onclick="loadPreviousImage()">
                        <img src="./assets/icons/arrow-right.svg" alt="">
                    </button>

                    <div class="image-counter">
                        <p id="current-image-position-text">x</p>
                        <p>/</p>
                        <p id="total-image-count-text">y</p>
                    </div>

                    <button class="dialog-image-selector-button" onclick="loadNextImage()">
                        <img src="./assets/icons/arrow-right.svg" alt="">
                    </button>
                </div>
            </dialog>
        </section>
    </main>

    <footer class="page-footer">
        <div class="da-logo-wrapper">
            <img src="./assets/svg/da_logo.svg" alt="The Developer Akademie logo.">
            <p>© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>

</body>

</html>
