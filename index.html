<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script src="./scripts/images.js"></script>

    <link rel="shortcut icon" href="./assets/icons/favicon.svg" type="image/x-icon">
</head>

<body onload="loadAllImages()">

    <header class="page-header">
        <img src="./assets/svg/fotogram_logo.svg" alt="The Fotogram logo.">
    </header>

    <main>
        <section class="photos-section">
            <header>
                <h1>Your personal photo album</h1>
            </header>

            <div id="imagesPanel" class="photos-panel">

            </div>

            <dialog id="photoDialog" closedby="any">
                <div class="photo-dialog-headline">
                    <h2 id="photoDialogTitle">Dummy title</h2>
                    <button class="close-dialog-button" onclick="closePhotoDialog()">
                        <img src="./assets/icons/close.svg" alt="A white cross.">
                    </button>
                </div>

                <img id="currentDialogImage">

                <div class="dialog-button-panel">
                    <button class="dialog-image-selector-button previous-selector-button" onclick="loadPreviousImage()">
                        <img src="./assets/icons/arrow-right.svg" alt="An arrow pointing left.">
                    </button>

                    <nav class="image-nav">
                        <p id="currentImagePositionText">x</p>
                        <p>/</p>
                        <p id="totalImageCountText">y</p>
                    </nav>

                    <button class="dialog-image-selector-button" onclick="loadNextImage()">
                        <img src="./assets/icons/arrow-right.svg" alt="An arrow pointing right.">
                    </button>
                </div>
            </dialog>
        </section>
    </main>

    <footer class="page-footer">
        <div class="da-logo-wrapper">
            <img src="./assets/svg/da_logo.svg" alt="The Developer Akademie logo.">
            <p>© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>

</body>

</html>
